worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 45;
    client_max_body_size 2048M;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss;
    gzip_min_length 256;

    server {
        listen 80;

        # Everything that goes to the backend: REST API, Swagger UI, OpenAPI schema.
        # "backend" is the compose service name — Docker DNS resolves it inside the network.
        # Same-origin for the browser: session cookies work without CORS.
        location ~ ^/(api/|swagger-ui|v3/api-docs) {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 2048M;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
}
