name: cloud-storage

services:

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: cloud-storage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-files}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-files}
      POSTGRES_DB: ${POSTGRES_DB:-files}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-files} -d ${POSTGRES_DB:-files}"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["infra"]

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: cloud-storage-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["infra"]

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    container_name: cloud-storage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["infra"]

  backend:
    build:
      context: ./backend
    container_name: cloud-storage-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-files}
      DB_USERNAME: ${POSTGRES_USER:-files}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-files}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-user-files}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    profiles: ["app"]

  frontend:
    image: nginx:1.27-alpine
    container_name: cloud-storage-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    profiles: ["app"]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: cloud-storage
